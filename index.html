<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 検索エンジンに載せたくない場合はこのまま。載せてよい場合は次の1行を削除 -->
  <meta name="robots" content="noindex, nofollow">
  <title>ペウント リンク集</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --accent: #1f6feb;
      --border: #dddddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #22252b;
        --text: #eeeeee;
        --muted: #aaaaaa;
        --accent: #6ea8ff;
        --border: #3a3e46;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.7;
    }
    header, main, footer {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header { padding-top: 32px; padding-bottom: 8px; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0; }
    nav { margin: 16px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    nav a {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
    }
    section { margin: 32px 0; scroll-margin-top: 16px; }
    h2 {
      font-size: 1.3rem;
      margin: 0 0 12px;
      padding-left: 10px;
      border-left: 5px solid var(--accent);
    }
    ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    ul.links a {
      display: block;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
    }
    ul.links a:hover, ul.links a:focus-visible { border-color: var(--accent); }
    ul.links a span {
      display: block;
      color: var(--muted);
      font-weight: normal;
      font-size: 0.9rem;
    }
    footer { color: var(--muted); font-size: 0.85rem; padding-bottom: 32px; }
  </style>
</head>
<body>
  <header>
    <h1>ペウント リンク集</h1>
    <p class="lead">ペウントで使うサイトです。リンクは新しいタブで開きます。</p>
  </header>

  <main>
    <!--
      ▼ リンクの追加方法
      <ul class="links"> の中に、次の1行をコピーして貼り付け、
      URL・サイト名・説明を書き換えてください。

      <li><a href="https://example.com" target="_blank" rel="noopener">サイト名<span>説明文</span></a></li>

      ▼ 見出しを増やす方法
      <section> 〜 </section> をまるごとコピーし、id と見出しを変更します。
    -->

    <section id="programming">
      <h2>プログラミング</h2>
      <ul class="links">
        <li><a href="https://studio.code.org/jp/courses/mc/units/1/lessons/1/levels/1" target="_blank" rel="noopener">Hour of Code<span>マインクラフトの世界でプログラミングに挑戦</span></a></li>
        <li><a href="https://scratch.mit.edu/" target="_blank" rel="noopener">Scratch<span>ブロックを組み合わせてゲームやアニメーションを作る</span></a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>最終更新：2026年10月</p>
  </footer>
</body>
</html>
